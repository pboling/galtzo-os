---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image is published to ghcr.io/pboling/galtzo-os
name: galtzo-os
# description will be included in the image's metadata
description: Aurora DX (stable-daily) with NordVPN, 1Password, asus-linux, and other tweaks

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/aurora-dx
image-version: stable-daily # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: script
    scripts:
      - prepare-1password-groups.sh

  - type: dnf
    repos:
      files:
        # - https://copr.fedorainfracloud.org/coprs/atim/starship/repo/fedora-%OS_VERSION%/atim-starship-fedora-%OS_VERSION%.repo
        - 1password.repo
        - asus-linux.repo
        - ghostty.repo
        - nordvpn.repo
    install:
      packages:
        - micro
        # NOTE: starship should be installed via brew install starship,
        #       since the rpm module package is not maintained
        # - starship
        # Necessary to install Ruby
        # See: https://github.com/rbenv/ruby-build/wiki#fedora
        - autoconf
        - gcc
        - gcc-c++
        - rust
        - patch
        - make
        - bzip2
        - openssl-devel
        - libyaml-devel
        - libffi-devel
        - libicu-devel
        - readline-devel
        - gdbm-devel
        - ncurses-devel
        - perl-FindBin # Because of OpenSSL!
        # Necessary for JRuby & dynamodb-local
        - java-25-openjdk-devel
        # Necessary for Quality of Life
        - nordvpn
        - 1password
        - 1password-cli
        # CLI to manage filesystem snapshots, primarily for Btrfs and LVM with ext4
        - snapper
        # For ASUS laptops, to manage fan profiles and other hardware features
        - asusctl
        - asusctl-rog-gui
        # Intel NPU driver for AI acceleration
        - intel-npu-driver
        # Terminal
        - ghostty
        # Memory management
        - earlyoom
        # Virtual Machine Manager HyperVisor Deps
        - qemu-kvm
        - libvirt
        - libvirt-daemon-kvm
        - libvirt-daemon-config-network
        - virt-manager
        - virt-install
        - virt-viewer

  - type: script
    scripts:
      - fix-zlib-symlink.sh
      - configure-virt-manager.sh

  - type: systemd
    system:
      enabled:
        - galtzo-1password-groups
        - nordvpnd
        # Keep the local QEMU/libvirt system connection available. The
        # per-user session socket is socket-activated by libvirt when used.
        - virtqemud.socket

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
